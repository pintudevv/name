[package]
name = "name_changer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
inquire = "0.7"
regex = "1.11"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
anyhow = "1.0"
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
